[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jellyfix"
version = "1.0.0"
description = "Jellyfin issue reporting with LibreDesk synchronization"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "starlette==1.4.1",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = ["coverage==7.15.3"]

[tool.setuptools]
package-dir = {"" = "backend"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

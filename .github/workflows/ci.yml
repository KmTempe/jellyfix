name: CI and Container Release

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: jellyfix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Python and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt

      - name: Install project and development dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Run tests with branch coverage
        run: |
          python -m coverage run --branch -m unittest discover -s backend -p "test_*.py" -v
          python -m coverage report --show-missing --fail-under=70

      - name: Compile Python
        run: python -m compileall -q backend/app backend/main.py

      - name: Validate injector JavaScript
        run: node --check frontend/injector.js

      - name: Reject unsafe injector sinks
        shell: bash
        run: |
          if grep -En 'innerHTML|outerHTML|insertAdjacentHTML|document\.write|eval\(|new Function' frontend/injector.js; then
            echo "Forbidden JavaScript rendering or execution sink found."
            exit 1
          fi

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Check changed-file whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git diff --check "$base" "$GITHUB_SHA"

  container-smoke:
    name: Container smoke test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag "jellyfix-ci:${GITHUB_SHA}" backend

      - name: Start hardened container
        run: |
          docker run --detach \
            --name jellyfix-ci \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /data:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18000:8000 \
            --env JELLYFIX_ENV=production \
            --env ROOT_PATH=/jellyfix \
            --env JELLYFIN_URL=http://127.0.0.1:9 \
            --env PUBLIC_ORIGIN=http://localhost:18000 \
            --env TRUSTED_HOSTS=localhost \
            --env STORAGE_PATH=/data \
            --env DATABASE_PATH=/data/tickets.db \
            "jellyfix-ci:${GITHUB_SHA}"

      - name: Verify health and hardening
        shell: bash
        run: |
          healthy=false
          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              --header 'Host: localhost' \
              http://127.0.0.1:18000/api/v1/healthz > /tmp/jellyfix-health.json; then
              healthy=true
              break
            fi
            sleep 1
          done
          [[ "$healthy" == "true" ]]
          grep -F '"status":"ok"' /tmp/jellyfix-health.json
          [[ "$(docker inspect --format '{{.Config.User}}' jellyfix-ci)" == "10001:10001" ]]
          [[ "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' jellyfix-ci)" == "true" ]]
          [[ "$(docker inspect --format '{{.State.Running}}' jellyfix-ci)" == "true" ]]

      - name: Show container logs on failure
        if: failure()
        shell: bash
        run: |
          if docker inspect jellyfix-ci >/dev/null 2>&1; then
            docker logs jellyfix-ci
          else
            echo "The smoke-test container was not created; inspect the build and start steps above."
          fi

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force jellyfix-ci >/dev/null 2>&1 || true

  publish:
    name: Publish GHCR image
    if: github.event_name == 'push'
    needs: [quality, container-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "${GITHUB_REF_NAME#v}" == "$project_version" ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kmtempe/jellyfix
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/kmtempe/jellyfix
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

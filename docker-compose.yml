services:
  jellyfix:
    container_name: jellyfix
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "18000:8000"
    volumes:
      - ./backend/data:/data
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - libredesk

networks:
  libredesk:
    external: true
    name: libredesk_libredesk
